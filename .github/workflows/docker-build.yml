name: Build e push immagine Docker su GHCR

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'renv.lock'
      - 'R/**'
      - 'run.R'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/sghizzus/money-monitor:latest
