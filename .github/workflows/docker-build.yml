name: Build e deploy su Azure Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'renv.lock'
      - 'R/**'
      - 'run.R'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ad Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build e push su ACR
        run: |
          az acr build \
            --registry moneymonitoracr \
            --image money-monitor:latest \
            .

      - name: Crea o aggiorna il Container App Job
        run: |
          IMAGE="moneymonitoracr.azurecr.io/money-monitor:latest"
          JOB="money-monitor-job"
          RG="money-monitor-rg"
          ENV="money-monitor-env"
          ACR_PASSWORD=$(az acr credential show --name moneymonitoracr --query "passwords[0].value" -o tsv)

          if az containerapp job show --name $JOB --resource-group $RG &>/dev/null; then
            az containerapp job update \
              --name $JOB \
              --resource-group $RG \
              --image $IMAGE
          else
            az containerapp job create \
              --name $JOB \
              --resource-group $RG \
              --environment $ENV \
              --trigger-type "Schedule" \
              --cron-expression "*/15 * * * *" \
              --replica-timeout 1800 \
              --image $IMAGE \
              --registry-server moneymonitoracr.azurecr.io \
              --registry-username moneymonitoracr \
              --registry-password "$ACR_PASSWORD" \
              --cpu 0.5 \
              --memory 1.0Gi \
              --secrets \
                  "db-pwd=${{ secrets.DB_PWD }}" \
                  "bbva-user=${{ secrets.BBVA_USER }}" \
                  "bbva-password=${{ secrets.BBVA_PASSWORD }}" \
              --env-vars \
                  "DB_PWD=secretref:db-pwd" \
                  "BBVA_USER=secretref:bbva-user" \
                  "BBVA_PASSWORD=secretref:bbva-password"
          fi
