name: Build e deploy su Azure Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'renv.lock'
      - 'R/**'
      - 'run.R'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ad Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build e push su ACR
        run: |
          az acr build \
            --registry moneymonitoracr \
            --image money-monitor:latest \
            .

      - name: Aggiorna il Container App Job con la nuova immagine
        run: |
          az containerapp job update \
            --name money-monitor-job \
            --resource-group money-monitor-rg \
            --image moneymonitoracr.azurecr.io/money-monitor:latest
