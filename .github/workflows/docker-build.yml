name: Build e deploy su Azure Container Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'renv.lock'
      - 'R/**'
      - 'run.R'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ad Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build e push su ACR
        run: |
          az acr build \
            --registry moneymonitoracr \
            --image money-monitor:latest \
            --cache-from moneymonitoracr.azurecr.io/money-monitor:latest \
            .

      # az containerapp job update non necessario: il job usa il tag :latest
      # e ripulla l'immagine automaticamente ad ogni esecuzione
